# Two-stage pipeline: unit (no credentials) / integration (real API).
#
# Uses a Docker executor (node:20) tagged 'openapi' for a modern Node.js
# toolchain and glibc. The previous shell runner had CentOS glibc 2.17,
# incompatible with Node.js 20 (requires glibc 2.28+).
#
# Integration credentials: TIGEROPEN_TIGER_ID, TIGEROPEN_PRIVATE_KEY,
# TIGEROPEN_ACCOUNT env vars set in GitLab CI Variables (Protected + Masked).

stages:
  - unit
  - integration

.node_base:
  image: node:20.18.0
  tags:
    - openapi
  before_script:
    - npm config set registry https://registry.npmmirror.com
    - npm ci --no-audit --no-fund

unit:node:
  extends: .node_base
  stage: unit
  timeout: 10 minutes
  script:
    # Drop this job's own stale report first: build dirs get reused, and a
    # leftover file would be re-archived as if this run had produced it.
    # Only our own file — a sibling job's report may legitimately sit here.
    - rm -f test-results/unit.xml
    - mkdir -p test-results
    # JUnit XML for notify job + GitLab test report widget.
    # --reporter=default keeps console output; --reporter=junit writes XML.
    # --testTimeout=30000: kill any single test that hangs >30s (prevents
    # the job from silently timing out against the runner's global limit).
    - npx vitest run --config vitest.config.ts --reporter=default --reporter=junit --outputFile=test-results/unit.xml --testTimeout=30000
  artifacts:
    when: always
    # Explicit file, not the whole directory: the runner reuses build dirs, so a
    # directory glob can also archive the *other* job's stale report from a
    # previous pipeline. Artifact download order across `needs` is not
    # guaranteed, so a stale copy can overwrite the real one in notify:webhook.
    paths:
      - test-results/unit.xml
    reports:
      junit:
        - test-results/unit.xml
    expire_in: 1 week

integration:node:
  extends: .node_base
  stage: integration
  allow_failure: true
  # Serialize per-branch: prevents a concurrent (e.g. scheduled) pipeline from
  # corrupting the shared test-results file via interleaved writes.
  resource_group: $CI_COMMIT_REF_SLUG
  variables:
    TIGER_RUN_INTEG: "true"
  script:
    # Drop this job's own stale report first: build dirs get reused, and a
    # leftover file would be re-archived as if this run had produced it.
    # Only our own file — a sibling job's report may legitimately sit here.
    - rm -f test-results/integration.xml
    - mkdir -p test-results
    - npx vitest run --config vitest.integ.config.ts --reporter=default --reporter=junit --outputFile=test-results/integration.xml
  artifacts:
    when: always
    # Explicit file, not the whole directory: the runner reuses build dirs, so a
    # directory glob can also archive the *other* job's stale report from a
    # previous pipeline. Artifact download order across `needs` is not
    # guaranteed, so a stale copy can overwrite the real one in notify:webhook.
    paths:
      - test-results/integration.xml
    reports:
      junit:
        - test-results/integration.xml
    expire_in: 1 week

# Pipeline result notification via chat webhook.
# Parses JUnit XML artifacts directly (no GitLab API dependency).
# Mirrors the Python SDK notify job structure.
notify:webhook:
  image: python:3.11.10-alpine
  tags:
    - openapi
  stage: .post
  when: always
  allow_failure: true
  needs:
    - job: unit:node
      artifacts: true
    - job: integration:node
      artifacts: true
  script:
    - |
      python3 << 'PYEOF'
      import os, json, urllib.request
      import xml.etree.ElementTree as ET

      webhook_url = os.environ.get("WEBHOOK_URL", "")
      if not webhook_url:
          print("WEBHOOK_URL not configured, skipping notification")
          exit(0)
      card_content_tag = os.environ["CARD_CONTENT_TAG"]

      # 1. Parse JUnit XML artifacts — split unit/integration stats.
      #    vitest --reporter=junit emits <testsuites><testsuite .../>.
      def parse_xml(path):
          """Return (total, passed, failed, skipped) or None on parse error."""
          t, f, s = 0, 0, 0
          try:
              tree = ET.parse(path)
              root = tree.getroot()
              for suite in root.iter("testsuite"):
                  t += int(suite.get("tests", 0))
                  f += int(suite.get("failures", 0)) + int(suite.get("errors", 0))
                  s += int(suite.get("skipped", 0))
          except Exception as e:
              print(f"Failed to parse {path}: {e}")
              return None, None, None, None
          return t, t - f - s, f, s

      unit_t, unit_p, unit_f, unit_s = parse_xml("test-results/unit.xml")
      integ_t, integ_p, integ_f, integ_s = parse_xml("test-results/integration.xml")

      # Key off `is not None`, not truthiness: a well-formed XML reporting 0
      # tests yields 0 — falsy, but perfectly available. `if unit_t` would
      # blank the line out and hide the very number that says something broke.
      unit_stats = f"Unit: {unit_t} tests: {unit_p} passed, {unit_f} failed, {unit_s} skipped" if unit_f is not None else ""
      integ_stats = f"Integration: {integ_t} tests: {integ_p} passed, {integ_f} failed, {integ_s} skipped" if integ_f is not None else ""

      # 2. Determine pass/fail.
      #    - unit_f is None  → XML missing/corrupt; treat as failed (conservative).
      #    - unit_f > 0      → explicit unit failures.
      #    - integ_f is None → XML missing/corrupt. integration:node is
      #      allow_failure:true, so a missing file could mean "job crashed
      #      before the JUnit reporter flushed" (a real problem worth
      #      surfacing) rather than "test failed" (which would already show
      #      up as integ_f > 0). We don't silently call this a pass — flag it
      #      as a warning instead, distinct from both green and red.
      #    CI_PIPELINE_STATUS is unreliable in .post stage (reads "running"),
      #    so we rely exclusively on parsed XML counts.
      #    - unit_t == 0 with a readable XML → the run collected nothing at all
      #      (a broken build, or an `include` glob matching no files). vitest
      #      still emits a <testcase><skipped/> for every test in a suite
      #      guarded by describe.skipIf, so tests="0" is never a legitimate
      #      "everything was skipped" — it always means we measured nothing.
      #      Not a pass: 0 is falsy but 0 is not None, so without this the
      #      run would score green and, since passes notify nobody, vanish.
      if unit_f is None:
          has_failed = True
          print("Unit JUnit XML unavailable — treating pipeline as failed")
      elif unit_t == 0:
          has_failed = True
          print("Unit XML parsed but reported 0 tests — treating pipeline as failed")
      else:
          has_failed = (unit_f > 0) or (integ_f is not None and integ_f > 0)

      # A readable integration XML reporting 0 tests is the same "couldn't
      # tell" as a missing one, so it takes the same yellow-card path rather
      # than turning the pipeline red on its own.
      integ_unavailable = integ_f is None or integ_t == 0
      if integ_f is None:
          print("Integration JUnit XML unavailable — flagging as warning (not silently passed)")
      elif integ_t == 0:
          print("Integration XML parsed but reported 0 tests — flagging as warning (not silently passed)")

      # 2b. Notify on failure only. A green card every 4 hours is noise nobody
      #     reads, which also desensitises the channel to the red ones.
      #     Note integ_unavailable is deliberately part of the condition: the
      #     yellow "results unavailable" card is a "couldn't tell", not a pass,
      #     so it must keep notifying. Silence here means "we positively
      #     verified everything passed".
      if not has_failed and not integ_unavailable:
          print(f"Pipeline passed — {unit_stats} | {integ_stats} — skipping notification")
          exit(0)

      # 3. Build notification card.
      if has_failed:
          title, color = "❌ Pipeline failed", "red"
      elif integ_unavailable:
          title, color = "⚠️ Pipeline passed (integration results unavailable)", "yellow"
      else:
          title, color = "✅ Pipeline passed", "green"
      project_name = os.environ.get("CI_PROJECT_NAME", "")
      branch = os.environ.get("CI_COMMIT_REF_NAME", "")
      commit = os.environ.get("CI_COMMIT_SHORT_SHA", "")
      pipeline_iid = os.environ.get("CI_PIPELINE_IID", "")
      pipeline_url = os.environ.get("CI_PROJECT_URL", "") + "/-/pipelines/" + os.environ.get("CI_PIPELINE_ID", "")

      content = f"**Repo:** {project_name}\n**Branch:** {branch}\n**Commit:** {commit}\n"
      if unit_stats:
          content += f"\n**Unit tests:** {unit_stats}\n"
      if integ_f is None:
          content += "\n**Integration tests:** ⚠️ results unavailable (XML missing or corrupt — job may have crashed)\n"
      elif integ_t == 0:
          # Say why "0 tests" is a problem; the bare stats line reads like a pass.
          content += "\n**Integration tests:** ⚠️ 0 tests collected (no suite ran — check the job log)\n"
      elif integ_stats:
          content += f"**Integration tests:** {integ_stats}\n"
      content += f"[View pipeline]({pipeline_url})"

      payload = {
          "msg_type": "interactive",
          "card": {
              "header": {
                  "title": {"tag": "plain_text", "content": f"{title} #{pipeline_iid} — {project_name}"},
                  "template": color
              },
              "elements": [
                  {"tag": "div", "text": {"tag": card_content_tag, "content": content}}
              ]
          }
      }

      data = json.dumps(payload).encode("utf-8")
      req = urllib.request.Request(webhook_url, data=data, headers={"Content-Type": "application/json"})
      try:
          with urllib.request.urlopen(req, timeout=10) as resp:
              result = json.loads(resp.read())
              print(f"Webhook response: {result}")
      except Exception as e:
          print(f"Webhook request failed: {e}")
      PYEOF
