# Two-stage pipeline: unit (no credentials) / integration (real API).
#
# Uses a Docker executor (node:20) tagged 'openapi' for a modern Node.js
# toolchain and glibc. The previous shell runner had CentOS glibc 2.17,
# incompatible with Node.js 20 (requires glibc 2.28+).
#
# Integration credentials: TIGEROPEN_TIGER_ID, TIGEROPEN_PRIVATE_KEY,
# TIGEROPEN_ACCOUNT env vars set in GitLab CI Variables (Protected + Masked).

stages:
  - unit
  - integration

.node_base:
  image: node:20.18.0
  tags:
    - openapi
  before_script:
    - npm config set registry https://registry.npmmirror.com
    - npm ci

unit:node:
  extends: .node_base
  stage: unit
  script:
    - npm run test:unit
  artifacts:
    when: always
    paths:
      - test-results/
    expire_in: 1 week

integration:node:
  extends: .node_base
  stage: integration
  allow_failure: true
  variables:
    TIGER_RUN_INTEG: "true"
  script:
    - npm run test:integ
  artifacts:
    when: always
    expire_in: 1 week

# Pipeline result notification via a generic webhook (e.g. chat
# incoming webhook). WEBHOOK_URL is a masked CI Variable — fork and PR runs
# that do not configure it simply skip this job, so it is safe to ship in an
# open-source repo.
notify:webhook:
  stage: .post
  when: always
  allow_failure: true
  dependencies: []
  script:
    - |
      if [ -z "$WEBHOOK_URL" ]; then
        echo "WEBHOOK_URL not configured, skipping notification"
        exit 0
      fi
      API="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}"
      JOBS_JSON=$(curl --fail -sS --header "JOB-TOKEN: ${CI_JOB_TOKEN}" "${API}/pipelines/${CI_PIPELINE_ID}/jobs" 2>/dev/null || echo "")
      # Decide pass/fail from job statuses rather than CI_PIPELINE_STATUS,
      # which may still read "running" in a .post when:always job (GitLab
      # known behaviour). jobs API returns name+status only — no trace/secrets.
      # allow_failure soft-fails don't block the pipeline, so don't list them.
      HAS_FAILED="no"
      FAILED_JOBS=""
      if [ -n "$JOBS_JSON" ] && command -v python3 >/dev/null 2>&1; then
        OUT=$(printf '%s' "$JOBS_JSON" | python3 -c "import sys,json; js=json.load(sys.stdin); failed=[j['name'] for j in js if j.get('status')=='failed' and not j.get('allow_failure')]; print('yes' if failed else 'no'); print(', '.join(failed))" 2>/dev/null || printf 'no\n')
        HAS_FAILED=$(printf '%s\n' "$OUT" | sed -n '1p')
        FAILED_JOBS=$(printf '%s\n' "$OUT" | sed -n '2p')
      else
        echo "jobs API or python3 unavailable, falling back to CI_PIPELINE_STATUS"
        if [ "$CI_PIPELINE_STATUS" = "failed" ]; then HAS_FAILED="yes"; fi
      fi
      TITLE="✅ Pipeline passed"
      COLOR="green"
      if [ "$HAS_FAILED" = "yes" ]; then
        TITLE="❌ Pipeline failed"
        COLOR="red"
      fi
      CONTENT="**Repo:** ${CI_PROJECT_NAME}\n**Branch:** ${CI_COMMIT_REF_NAME}\n**Commit:** ${CI_COMMIT_SHORT_SHA}\n"
      if [ -n "$FAILED_JOBS" ]; then
        CONTENT="${CONTENT}\n**Failed jobs:** ${FAILED_JOBS}\n"
      fi
      CONTENT="${CONTENT}[View pipeline](${CI_PROJECT_URL}/-/pipelines/${CI_PIPELINE_ID})"
      PAYLOAD=$(cat <<EOF
      {
        "msg_type": "interactive",
        "card": {
          "header": {
            "title": {"tag": "plain_text", "content": "$TITLE #${CI_PIPELINE_IID} — ${CI_PROJECT_NAME}"},
            "template": "$COLOR"
          },
          "elements": [
            {"tag": "div", "text": {"tag": os.environ["CARD_CONTENT_TAG"], "content": "$CONTENT"}}
          ]
        }
      }
      EOF
      )
      curl --fail -sS -X POST "$WEBHOOK_URL" \
        -H 'Content-Type: application/json' \
        -d "$PAYLOAD"
